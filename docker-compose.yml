version: '3.8'

services:
  telecaller:
    build: .
    container_name: ai-telecaller
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./transcripts:/app/transcripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
